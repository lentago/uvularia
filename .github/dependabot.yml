version: 2
updates:
  # Root plus each template root: the templates' SHA-pinned actions
  # (templates/*/.github/workflows, synced to the client template repos) are
  # only kept current if Dependabot scans them here. Merging a bump re-syncs
  # through template-sync like any other templates/ change.
  - package-ecosystem: github-actions
    directories:
      - /
      - /templates/records
      - /templates/ask-rules
      - /templates/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grouping collapses weekly churn into at most two PRs per ecosystem while
    # keeping the risk split visible in the PR list itself: the "-routine" PR
    # is reviewable on green checks, and the "-major" PR is where breaking
    # changes land and gets read deliberately. One group for everything would
    # hide a major bump inside a pile of patches; no grouping produces a
    # flood of individual PRs (see lentago/.github#114).
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  # The site template is the only npm toolchain in the repo (Astro). Grouping
  # minor+patch into one weekly PR keeps routine churn reviewable on green
  # checks, while majors still arrive as their own PRs to be read deliberately.
  # Kept so the Dependabot alerts this ecosystem raised cannot pile up silently
  # again.
  - package-ecosystem: npm
    directory: /templates/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
