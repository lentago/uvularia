# ============================================================================
# Claude Code — Automated PR Review
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-review.yml.
# Pinned to Haiku.
#
# >>> CUSTOMIZE THE review_prompt BELOW FOR THIS REPO. <<<
# Do NOT ship the placeholder. A copy-pasted prompt that describes the wrong
# repo is worse than none — it points the reviewer at the wrong rubric. The
# good fleet examples (betula, drosera,
# reference-checker) each describe their OWN content.
# Also review `paths-ignore`: if markdown is this repo's product, do NOT
# ignore "*.md".
# ============================================================================

name: Claude Code Review

# >>> DISABLED 2026-06-25: automated Claude PR review turned off fleet-wide.
# Trigger changed from `pull_request` to manual `workflow_dispatch` only, so it
# never auto-runs on PRs. The repo-specific review_prompt below is preserved.
# To re-enable, restore the `on: pull_request` trigger (see git history).
on:
  workflow_dispatch:

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: lentago/shared-workflows/.github/workflows/claude-review.yml@v1.2.3 # v1.2.3
    secrets: inherit
    with:
      review_prompt: |
        This repository is uvularia, the Lentago Labs records vault: schemas,
        a stdlib-only validator and obligation evaluator, three repository
        templates a client instantiates in their own GitHub org (records vault,
        Ask rules, site), a Massachusetts obligations pack, and a fictional,
        renameable demonstration client. Review for:

        **Separation.** Nothing in the records template may change a rule;
        nothing in the rules template may change a record; the site template
        must build from the published bundle, never a vault checkout.

        **Invariants.** Public-only visibility, no deletion of published
        records, server-side timestamps in receipts, "no data" never rendered
        as green, demo identity only in demo/org.yaml.

        **Readability.** Anything a client runs in CI must be standard-library
        Python a tech director can read; no new dependencies without an ADR.

        **Portability.** No Lentago estate specifics (hostnames, accounts,
        container ids) under templates/ or demo/; a stranger's org with a free
        GitHub account must be enough.

        **Schema discipline.** Frontmatter fields come from core/schema only;
        record ids are stable path slugs; supersession is a chain, not a rename.

        **Prose.** Reader-facing Markdown follows the fleet voice guide: what,
        why, how long, how you know it worked; terms defined on first use.
