# ============================================================================
# template-telemetry — pipeline events stay optional and harmless (issue #52)
# ============================================================================
# Runs templates/tests on every pull request:
#
#   1. the records template's real publish job, step by step against a local
#      throwaway origin, with the Loki variables UNSET (must pass, print the
#      "telemetry not configured" notice once, and never reach the Loki step)
#      and SET with Loki down (must still pass; the event must be well formed);
#      the validate job with the variables unset, too;
#   2. the shape of every telemetry step in every template workflow (gated,
#      continue-on-error, time-boxed, drosera-valid labels);
#   3. the two copies of scripts/telemetry.py are byte-identical;
#   4. the schedules (#59): the records template's daily-snapshot jobs pass
#      quietly with telemetry unset and send their counts when set; the rules
#      template's 15-minute heartbeat pings /health and never turns red.
#   5. the vendored loki-event action: unchanged from drosera at the commit its
#      header names (also fetched and compared here), identical in both
#      templates, used by every telemetry step as ./.github/actions/loki-event,
#      and push.sh really pushes to a local stand-in Loki.
#
# Each check also runs against a mutated copy to prove it can fail. PyYAML is
# installed for the harness only; no template depends on it.
#
# Deliberately NOT path-filtered: a required check whose workflow never fires
# is held "Expected" forever and deadlocks every non-matching PR.
# ============================================================================

name: template-telemetry

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  template-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the job harness's YAML reader
        run: pip install --quiet pyyaml
      - name: Run the template telemetry tests
        env:
          # Also compare the vendored loki-event action with drosera at the
          # commit its header names; an unreachable GitHub is a skip with a
          # notice, never a pass.
          UVULARIA_CHECK_UPSTREAM: "1"
        run: python3 -m unittest discover -s templates/tests -p "test_*.py" -v
