# ============================================================================
# intake — test the vault template's Issue-form intake door
# ============================================================================
# Runs templates/records/scripts/tests on every pull request: the form parser
# and the record scaffolder, over two fixture issue bodies (one with an attached
# file, one without), plus a failed-download case that must still scaffold. The
# scaffolded record is validated with the vendored core/validate.py — the whole
# "done when" of #7 is that the scaffold passes validation unedited. Stdlib only.
# The same directory also holds the watch tests (scripts/watch.py, #53): condition
# logic and issue dedupe over fixture standings and /health replies, offline;
# and the telemetry tests (scripts/telemetry.py, #52) with the pipeline-pane
# counts (scripts/pipeline_snapshot.py, #59) over an in-memory GitHub API.
# And the plain public board (scripts/board.py, #70): every state as a word and
# a colour, "no data" when standing.json is missing or bad, escaping, links.
#
# Deliberately NOT path-filtered. Like the other test workflows, this is built to
# serve as a required status check, and a required check whose workflow never
# triggers is held "Expected" forever, deadlocking every non-matching PR. The
# suite is cheap and exits in well under a second.
# ============================================================================

name: intake

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the intake door, watch, telemetry, and board tests
        run: python3 -m unittest discover -s templates/records/scripts/tests -p "test_*.py" -v
