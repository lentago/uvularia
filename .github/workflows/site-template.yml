# ============================================================================
# test-site — the site template's own tests, run in THIS repo on every PR
# ============================================================================
# templates/site/ ships build-check.yml for the client's repo, but nothing in
# lentago/uvularia's CI exercised the template itself until this workflow. No
# `on:`-level path filter: a path-filtered required check never fires on
# non-matching PRs and is held "Expected" forever (the fleet's deadlock rule).
# ============================================================================
name: site-template

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'   # astro 7 requires Node >=22.12.0
          cache: npm
          cache-dependency-path: templates/site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check   # astro check over the template's own config and pages
      - run: npm test
