# ============================================================================
# deploy-pages — build the site from the vault's published artifacts and deploy
# it to GitHub Pages
# ============================================================================
# Runs on every push to main AND on a 30-minute schedule. The schedule is what
# makes the "Is it posted?" board follow the vault without a site commit: the vault
# republishes standing.json on its own merges, and this redeploys to pick it up.
# (The same cadence drosera's status page uses.)
#
# The build fetches corpus-latest.json, standing.json, feed.xml, and the current
# receipt from publishedBaseUrl in site.config.ts, validates the corpus and
# standing against their schemas, and fails rather than deploy an invalid site. A
# vault that has published nothing yet deploys an honest empty site with a "no
# data" board — never a fake green.
#
# It does nothing, and stays green, until GitHub Pages is enabled for the
# repository (Settings -> Pages -> Source: GitHub Actions). A first job asks the
# Pages API whether a site exists here; the build and deploy jobs run only if it
# does. configure-pages never enables Pages itself, so this workflow cannot create
# a site as a side effect. Nothing to configure: the probe uses this repository's
# own name and the job token.
#
# Paths are relative to the repository root: in your org this template IS the repo.
# ============================================================================

name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, so the board follows the vault
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight deploy (a cancelled Pages deploy
# can leave the environment half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 means "no Pages site here": skip, green. Any other error fails
          # the run rather than silently skipping a deploy.
          if err=$(gh api "repos/${{ github.repository }}/pages" --silent 2>&1); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<<"$err"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository; skipping the deploy."
          else
            echo "$err" >&2
            exit 1
          fi

  build:
    needs: probe
    if: needs.probe.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'   # astro 7 requires Node >=22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build the site from the vault's published artifacts
        run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: [probe, build]
    if: needs.probe.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
