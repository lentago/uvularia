# ============================================================================
# deploy-pages — build the site from the vault's published artifacts and deploy
# it to GitHub Pages
# ============================================================================
# Runs on every push to main AND on a 30-minute schedule. The schedule is what
# makes the "Is it posted?" board follow the vault without a site commit: the vault
# republishes standing.json on its own merges, and this redeploys to pick it up.
# (The same cadence drosera's status page uses.)
#
# The build fetches corpus-latest.json, standing.json, feed.xml, and the current
# receipt from publishedBaseUrl in site.config.ts, validates the corpus and
# standing against their schemas, and fails rather than deploy an invalid site. A
# vault that has published nothing yet deploys an honest empty site with a "no
# data" board — never a fake green.
#
# Paths are relative to the repository root: in your org this template IS the repo.
# ============================================================================

name: deploy-pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, so the board follows the vault
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight deploy (a cancelled Pages deploy
# can leave the environment half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'   # astro 7 requires Node >=22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build the site from the vault's published artifacts
        run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
